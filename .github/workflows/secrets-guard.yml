name: Sensitive Guard

# Blocks any push/PR that re-introduces local absolute paths, cloud SSH targets
# or key-file names. Rules live in tools/scrub_sensitive.py (class-based, no
# literal values) so the guard never re-publishes what it detects.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "Also scan every commit in history (slow)"
        type: boolean
        default: false

jobs:
  scan-worktree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: python3 tools/scrub_sensitive.py --check

  scan-history:
    # Opt-in only: full-history scan is O(commits x files) and slow.
    if: github.event_name == 'workflow_dispatch' && inputs.full_history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit
        run: |
          set -euo pipefail
          fail=0
          for c in $(git rev-list --all); do
            if ! python3 tools/scrub_sensitive.py --check-rev "$c" > /tmp/hits.$$ 2>&1; then
              echo "::error::sensitive content at $c"
              head -20 /tmp/hits.$$
              fail=1
            fi
          done
          rm -f /tmp/hits.$$
          exit $fail
