# learning/configs/mps_main.yaml — S1 正式冒烟档（父 design D6 规格，MPS 小时级，CI 不跑）
#
# 职责：与 smoke_tiny 同一份代码、同一套字段口径，只把尺寸与步数拉到 D6 说的 ~40M 参数档。
# 本文件是"要跑正式档就照这里改"的真源；任何一次正式跑都必须先跑通 smoke_tiny。
#
# 跑法（两步，都不在 CI 里）：
#   1) 先装配正式语料（corpus.yaml 的 main 档，1–3 亿编号，数小时级、走远端双源）：
#      .venv/bin/python -m sys1.data.pretrain_corpus --config main --out runs/corpus_main
#   2) 再练：.venv/bin/python learning/s1_pretrain_gpt.py --config mps_main
#      断了就 --resume <run 目录>；同一份 config 换 seed 另开一段也是允许的接续方式（notes 说明）。
#
# 时长账（诚实口径，不保证准点）：每步读入 8×1024×8 = 65536 个编号，2000 步 ≈ 1.3 亿编号；
# MPS 上 ~40M 参数、ctx=1024 的前后向吞吐按经验 5–10k 编号/秒估，落在 4–8 小时量级，
# 与父 design"MPS 数小时"一致。若中途统一内存换页导致吞吐塌掉，按 design 的风险回退
# 走"分段多 run"（同 config 不同 seed 段拼接），而不是偷偷把步数改成看不出来的小值。
# 红线（GUIDE §7-0）：全档没有任何第三方权重项；起步只有 seed 决定的随机数字。
run:
  name: s1-mps-main

model:
  d: 512                           # D6：d=512 / L=12 / heads=8 / ctx=1024，~40M 参数
  L: 12
  heads: 8
  ctx: 1024
  vocab: 16000                     # 与自训产物一致；换表只改这一处
  rope_theta: 10000.0
  seed: 0
  ffn_mult: 4
  norm_eps: 1.0e-5
  pad_token_id: 0

data:
  corpus_dir: runs/corpus_main     # corpus.yaml main 档的产物（1.2 亿编号上限）
  seq_len: 1024                    # 与 ctx 齐平：窗口比 ctx 短才谈得上"位置没出格"
  batch_size: 8
  seed: 0

train:
  device: mps                      # auto 也行；正式档明确写 mps，好让 run 记录里设备是可核对的
  threads: 0                       # 0=不动 torch 默认线程数（MPS 侧由运行时自己决定）
  max_steps: 2000                  # ≈1.3 亿编号；分几段跑完时按段各自记账
  lr: 3.0e-4
  warmup_steps: 200
  min_lr_frac: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  grad_accum: 8                    # 等效批量 64 段×1024：MPS 上一次塞不下，靠累积凑
  log_interval: 20
  save_interval: 250               # 每 250 步一份存档：崩在半路最多丢 250 步
  keep_last: 3

sample:
  n: 8
  temperature: 0.8
  top_k: 40
  max_new_tokens: 40
  prompts:
    - "今天天气"
    - "深度学习需要"
    - "The capital of France is"
    - "Once upon a time"
    - "下列选项中正确的是"
    - "In 1969, humans"
    - "床前明月光，"
    - "Evidence shows that"
